server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El proxy evita CORS y permite que el navegador consuma /api en el mismo origen.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La PWA debe consultar siempre el manifiesto y el documento principal más recientes.
    # Evita que una pestaña abierta conserve una versión anterior de la interfaz.
    location = /ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Soporta rutas de Angular al recargar la página.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
